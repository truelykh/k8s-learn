apiVersion: v1
kind: Pod
metadata:
  namespace: learn
  name: nginx-pod
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiversion: v1
kind: Service
metadata:
  namespace: learn
  name: nginx-service
  labels:
    app: nginx-service
spec:
  selector:
    app: nginx
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
---
