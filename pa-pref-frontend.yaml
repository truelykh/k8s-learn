apiVersion: v1
kind: Pod
metadata:
  namespace: learn
  name: pod-fe
  labels:
    app: pod-fe
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabel:
                app: backend-pp
            topologyKey: kubernetes.io/hostname
---
apiversion: v1
kind: Service
metadata:
  namespace: learn
  name: frontend-svc
  labels:
    app: frontend-svc
spec:
  selector:
    app: pod-fe
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
