apiVersion: v1
kind: Pod
metadata:
  namespace: learn
  name: pdside-node-affinity
  labels:
    app: nginx-pdside
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: disk
                operator: In
                values:
                  - ssd
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  namespace: learn
  name: pdside-node-affinity-service
  labels:
    app: pdside-node-affinity-service
spec:
  selector:
    app: nginx-pdside
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
---
