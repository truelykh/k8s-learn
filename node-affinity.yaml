apiVersion: v1
kind: Pod
metadata:
  namespace: learn
  name: nodeaffinity
  labels:
    app: nginx
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: disk
                operator: In
                values:
                  - ssd
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  namespace: learn
  name: nodeaffinity-service
  labels:
    app: nodeaffinity-service
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
---
